<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    p {
        font-weight: bold;
        font-size: 18px;
        color: blue;
    }
 
    header {
    background-color: darkblue;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 25px;
    }   

    nav {
    background-color: darkgray;
    text-align: center;
    }

    nav a {
    display: inline-block;
    font-size: 22px;
    color: white;
    padding: 20px;
    }

    nav a:hover {
    background-color: lightgray;
    }

    .button {
        display: inline-block;
        background-color: darkblue;
        font-size: 18px;
        color: white;
        padding: 20px 30px;
        border-radius: 5px;
        transition: opacity .3s;
    }

    .button:hover {
        opacity: 0.8;
    }

    @media (max-width: 480px) {
    nav a {
        display: block;
    }
}

</style>
<body>
<header>
    <h1>JavaScript Statements</h1>
</header>
<nav>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact Us</a>
</nav>
<p>JavaScript statements are separated by semicolons.</p>

<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>
<p id="demo4"></p>
<p id="demo5"></p>

<script><!-- Place your code here -->
let a=10;
let b=5;
let c=a-b;
let d=15;
let e=c+d;

document.getElementById("demo1").innerHTML = a;
document.getElementById("demo2").innerHTML = b;
document.getElementById("demo3").innerHTML = c;
document.getElementById("demo4").innerHTML = d;
document.getElementById("demo5").innerHTML = e;
</script>

<a href="https://www.google.com" class="button">Google</a>


</body>
</html>
