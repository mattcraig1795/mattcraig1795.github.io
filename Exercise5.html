<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color + Margin + Background – Practice</title>

  <style>
    body {
      /* ────────────── TO DO 1 ────────────── */
      /* Set a background color or simple gradient for the whole page */
      background: purple;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .container {
      /* ────────────── TO DO 2 ────────────── */
      /* 
        - Use margin to create space between cards
        - You can use flexbox or just margin – both are okay
      */
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1100px;
    }

    .card {
      width: 240px;
      min-height: 280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);

      /* ────────────── TO DO 3 ────────────── */
      /* Give each card a different background color */
      background-color: green;
      
      /* You can also try: 
         background: linear-gradient(to bottom, #......, #......);
      */
    }

    .card2 {
        background: linear-gradient(to top, lightgray, black);
        width: 400px;
        height: 200px;
        padding: 20px;
        border: 8px solid darkslategray;
        margin: 30px;
        box-sizing: border-box;
        text-align: center;    
    }
    /* You may add more classes below ↓↓↓ */

    .card:nth-child(1) { background: linear-gradient(to bottom, orange, red); }
    .card:nth-child(2) { background: linear-gradient(to bottom, lightgreen, green); }
    .card:nth-child(3) { background: linear-gradient(to bottom, cyan, blue); }
    .card:nth-child(4) { background: linear-gradient(to bottom, pink, orangered); }

    .card-content {
      padding: 24px 20px;
      color: white;
      text-align: center;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 1.4rem;
    }

    p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.9;
    }

    /* Optional bonus: hover effect */
    .card:hover {
      transform: translateY(-8px);
      transition: transform 0.25s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
    <div class="card2">
        <div class="card-content">
            <h2>Exercise 5</h2>
            <p>CSS is awesome</p>
        </div>
    </div>

  <div class="container">
    <div class="card">
      <div class="card-content">
        <h2>Summer</h2>
        <p>Warm days, cold drinks, long evenings</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Forest</h2>
        <p>Green, calm, moss and mystery</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Ocean</h2>
        <p>Deep blue, waves, freedom</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Sunset</h2>
        <p>Orange, pink, magic hour</p>
      </div>
    </div>
  </div>

</body>
</html>
