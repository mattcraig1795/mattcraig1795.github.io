<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sprite Navigation Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #222;
      line-height: 1.6;
    }

    /* ========== Horizontal Navigation with CSS Sprites ========== */
    nav {
      background: #1a1a2e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
    }

    nav li {
      flex: 1;
    }

    nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px;
      color: #eee;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
      border-right: 1px solid #2a2a40;
    }

    nav li:last-child a {
      border-right: none;
    }

    nav a:hover {
      background: #16213e;
      color: #00d4ff;
    }

    /* Sprite icon base */
    .icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      background-image: url('https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/sprites/solid.svg');
      /* Fallback solid color sprite simulation using a public sprite sheet approach */
      background-size: 24px 120px; /* height covers multiple icons */
      background-repeat: no-repeat;
    }

    /* Individual sprite positions (simulated with background-position) */
    .icon-home   { background-position: 0 0; }
    .icon-about  { background-position: 0 -24px; }
    .icon-services { background-position: 0 -48px; }
    .icon-contact { background-position: 0 -72px; }

    /* Better reliable sprite approach using a single PNG sprite sheet */
    /* Using a real public CSS sprite example */
    .sprite {
      display: inline-block;
      width: 32px;
      height: 32px;
      background-image: url('https://www.w3schools.com/css/img_navsprites.gif');
      background-repeat: no-repeat;
    }

    .sprite-home     { background-position: 0 0; }
    .sprite-about    { background-position: -91px 0; }
    .sprite-services { background-position: -182px 0; }
    .sprite-contact  { background-position: -273px 0; }

    /* ========== Main content ========== */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #1a1a2e;
    }

    .images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 30px;
    }

    .images figure {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .images figure:hover {
      transform: translateY(-4px);
    }

    .images img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .images figcaption {
      padding: 14px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      nav ul {
        flex-direction: column;
      }
      nav a {
        border-right: none;
        border-bottom: 1px solid #2a2a40;
      }
      .images {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Horizontal Navigation Bar with CSS Sprites -->
  <nav>
    <ul>
      <li>
        <a href="#home">
          <span class="sprite sprite-home"></span>
          Home
        </a>
      </li>
      <li>
        <a href="#about">
          <span class="sprite sprite-about"></span>
          About
        </a>
      </li>
      <li>
        <a href="#services">
          <span class="sprite sprite-services"></span>
          Services
        </a>
      </li>
      <li>
        <a href="#contact">
          <span class="sprite sprite-contact"></span>
          Contact
        </a>
      </li>
    </ul>
  </nav>

  <main>
    <h1>Welcome to the Demo Page</h1>
    <p style="text-align:center; margin-bottom: 20px;">
      This page features a horizontal navigation bar that uses a single CSS sprite image for the icons.
    </p>

    <!-- Two Images -->
    <div class="images">
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
        <figcaption>Image 1 – Mountain Landscape</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1016/600/400" alt="Coastal view">
        <figcaption>Image 2 – Coastal View</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    CSS Sprite Navigation Example • Built with pure HTML & CSS
  </footer>

</body>
</html>
