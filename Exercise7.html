<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            margin: 30px auto;
            border: 3px solid #333333;
            background-color: rgb(172, 93, 93);
        }

        td {
            padding: 20px;
        }

        img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            opacity: 0.5;
        }

        .owlbear {
            opacity: 0.2;
        }

        .beholder {
            opacity: 0.0;
        }

        .cube {
            opacity: 0.6;
        }

        .owlbear:hover {
            opacity: 1.0;
        }

        .beholder:hover {
            opacity: 1.0;
        }

        .cube:hover {
            opacity: 1.0;
            border: 5px solid green;
        }

    </style>
</head>
<body>
    <h1>Exercise 7</h1>
    <table>
        <tr>
            <td>
                <img class="owlbear" src="owlbear.jpeg" alt="Owlbear">
            </td>
            <td>
                <img class="beholder" src="Beholder.jpeg" alt="Beholder">
            </td>
            <td>
                <img class="cube" src="GelatinousCube.jpeg" alt="Gelatinous Cube">
            </td>
        </tr>
    </table>

</body>
</html>
